# Public HTTPS front end for the inventory API (demo). Migrated: wave 1.
server {
    listen 443 ssl;
    server_name inventory.northwind.test;
    ssl_certificate     /etc/ssl/warehouse-api.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 fallback for old handheld scanners: ECDHE stays until they are replaced (wave 2)
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384';
    # hybrid post-quantum key exchange first; X25519 only for clients without ML-KEM
    ssl_ecdh_curve X25519MLKEM768:X25519;
}
