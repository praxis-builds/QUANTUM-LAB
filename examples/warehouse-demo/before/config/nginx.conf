# Public HTTPS front end for the inventory API (demo)
server {
    listen 443 ssl;
    server_name inventory.northwind.test;
    ssl_certificate     /etc/ssl/warehouse-api.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA:DES-CBC3-SHA';
    ssl_ecdh_curve prime256v1;
}
