name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core tests (no [pqc] extra)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4  # the dashboard's JavaScript tests run under Node
        with:
          node-version: "20"
      - name: Install (core + dev only)
        run: python -m pip install -e '.[dev]'
      - name: Tests
        # Post-quantum tests skip cleanly without the extra; the scanner tests that need
        # 'cryptography' skip too. Everything else runs.
        run: python -m pytest -q -ra

  pqc:
    name: post-quantum tests ([pqc] extra + liboqs)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true  # optional: builds a C library; never blocks the core result
    env:
      LIBOQS_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache liboqs
        id: liboqs-cache
        uses: actions/cache@v4
        with:
          path: ~/_oqs
          key: liboqs-${{ env.LIBOQS_VERSION }}-noopenssl-${{ runner.os }}
      - name: Build liboqs (shared, without OpenSSL; docs/DECISIONS.md D1)
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LIBOQS_VERSION" https://github.com/open-quantum-safe/liboqs /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -DCMAKE_INSTALL_PREFIX="$HOME/_oqs" \
            -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_USE_OPENSSL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/liboqs/build --parallel 4
          cmake --build /tmp/liboqs/build --target install
      - name: Install (core + dev + pqc)
        run: python -m pip install -e '.[dev,pqc]'
      - name: Post-quantum lessons, C demo, scanner and case study
        run: >
          python -m pytest -q -ra tests/test_lesson_30.py tests/test_lesson_31.py tests/test_lesson_32.py
          tests/test_lesson_33.py tests/test_lesson_c.py tests/test_pq_inventory.py tests/test_warehouse_demo.py
