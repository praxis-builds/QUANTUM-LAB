[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-quantum-lab"
version = "0.1.0"
description = "A local, simulator-only learning lab for classical and quantum-kernel classification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Praxis Quantum Lab" }]
dependencies = [
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
# markdown builds the Pages site (tools/build_site.py); jsonschema checks the CBOM against the CycloneDX schema.
dev = ["pytest==9.1.1", "markdown==3.11", "jsonschema==4.26.0"]
# Post-quantum lessons 30-33 and the scanner's key parsing. liboqs-python also needs the liboqs C
# library (0.16.0, shared) in ~/_oqs or OQS_INSTALL_PATH; see docs/DECISIONS.md (D1).
pqc = ["liboqs-python==0.16.0.1", "cryptography==50.0.2"]

[project.scripts]
praxis-qiskit-experiments = "praxis_quantum_lab.qiskit_experiments:main"
praxis-kernel-experiment = "praxis_quantum_lab.kernel_experiment:main"
praxis-density-matrix-sweep = "praxis_quantum_lab.density_matrix_noise:main"
pq-inventory = "pq_inventory.cli:main"
pq-tls = "pq_tls.cli:main"

[tool.setuptools.packages.find]
where = ["src", "tools"]

[tool.setuptools.package-data]
praxis_quantum_lab = ["dashboard_assets/*.html", "dashboard_assets/*.css", "dashboard_assets/*.js"]
pq_inventory = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-ra"
